name: NUS Companion Push Reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test push notification to every registered device"
        required: false
        type: boolean
        default: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: push-server/package.json
      - name: Install push server dependencies
        working-directory: push-server
        run: npm install --omit=dev
      - name: Send due reminders
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          PUSH_TEST: ${{ inputs.test_notification || 'false' }}
          FIREBASE_PROJECT_ID: nus-app-5a7d7
          DIAGNOSTIC_USER_ID: REPLACE_WITH_YOUR_FIREBASE_USER_UID
        working-directory: push-server
        run: node send-reminders.mjs
