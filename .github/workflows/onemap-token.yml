name: Refresh OneMap token

# OneMap tokens last 3 days; renew twice a day so the app always has one.
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: push-server/package.json
      - name: Install dependencies
        working-directory: push-server
        run: npm install --omit=dev
      - name: Refresh token
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ONEMAP_EMAIL: ${{ secrets.ONEMAP_EMAIL }}
          ONEMAP_PASSWORD: ${{ secrets.ONEMAP_PASSWORD }}
        working-directory: push-server
        run: node refresh-onemap-token.mjs
